<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北印度生存指南：德里到恒河</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0B0D10; --panel:#14181D; --panel2:#1B2128; --ink:#EDEFF2; --muted:#98A1AD; --line:#2A313A;
  --hp:#58C24A; --money:#F4C430; --warn:#E5484D; --gut:#F29D38; --alert:#4BA3F5; --good:#6FCF97;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --num:"Oswald","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75}
main{max-width:760px;margin:0 auto;padding:0 0 64px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--money);outline-offset:2px}

/* game screen */
.screen{position:relative;width:100%;aspect-ratio:4/3;max-height:62vh;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;transition:filter .9s}
#bg svg,#bg img{width:100%;height:100%;display:block;object-fit:cover;animation:fadein .6s ease}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%),linear-gradient(to bottom,rgba(0,0,0,.4),transparent 24%,transparent 68%,rgba(0,0,0,.6))}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.hud{position:absolute;z-index:2;text-shadow:0 1px 2px #000}
.mission{top:10px;left:10px;max-width:54%;background:rgba(0,0,0,.74);padding:6px 10px;font-size:12.5px;line-height:1.5;border-left:3px solid var(--money);text-shadow:none}
.mission b{display:block;color:var(--money);font-weight:900}
.vitals{top:10px;right:10px;width:38%;max-width:210px;display:grid;grid-template-columns:auto 1fr;gap:3px 6px;align-items:center;font-size:10.5px;font-weight:900;line-height:1}
.hpbar{position:relative;height:6px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.3)}
.hpbar.big{height:13px}
.hpbar i{display:block;height:100%;transition:width .5s}
.hpbar em{position:absolute;right:4px;top:0;line-height:11px;font:700 10px/11px var(--num);font-style:normal;text-shadow:0 0 2px #000,0 0 2px #000}
.low i{background:var(--warn) !important;animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.money{grid-column:1/-1;justify-self:end;margin-top:3px;background:rgba(0,0,0,.74);color:var(--money);font:700 19px/1.35 var(--num);padding:0 9px;letter-spacing:.03em;text-shadow:none}
.money.low{color:var(--warn)}
.minimap{left:10px;bottom:10px;width:24%;max-width:132px;min-width:84px;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.75);box-shadow:0 0 0 2px rgba(0,0,0,.6);background:#1b2026}
.minimap svg{width:100%;height:100%;display:block}
.place{right:12px;bottom:10px;max-width:66%;text-align:right;font-weight:900;font-style:italic;font-size:clamp(20px,5.6vw,32px);line-height:1.15}
.place small{display:block;font-size:12px;font-weight:500;font-style:normal;opacity:.92;margin-top:2px}
.banner{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:clamp(30px,9vw,60px);letter-spacing:.1em;line-height:1.2;text-shadow:0 3px 0 #000,0 0 28px rgba(0,0,0,.9);padding:0 12px}
.banner small{display:block;font-size:.34em;letter-spacing:.3em;color:#fff;opacity:.9}
.screen.fail .banner{display:flex;color:var(--warn)}
.screen.fail #bg{filter:grayscale(1) brightness(.5) contrast(1.15)}
.screen.pass .banner{display:flex;color:var(--money)}
.screen.fail .place,.screen.pass .place{display:none}

/* text + choices */
#stage{padding:12px 12px 0}
.panel{background:var(--panel);border-left:3px solid var(--line);border-radius:4px;padding:16px}
.panel p{margin:0 0 .9em}
.panel p:last-child{margin-bottom:0}
.when{color:var(--money);font-size:12.5px;font-weight:900;margin-bottom:.4em !important}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:15px;font-weight:500;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--money);background:var(--panel2)}
.opt small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.opt:disabled{opacity:.42;cursor:not-allowed}
.key{font:700 15px/1 var(--num);min-width:30px;height:30px;display:inline-grid;place-items:center;border:2px solid currentColor;border-radius:5px;padding:0 6px;box-shadow:0 2px 0 currentColor}
.go{display:inline-flex;align-items:center;gap:10px;background:var(--money);color:#111;border:0;border-radius:4px;padding:9px 18px 11px 10px;font-weight:900;font-size:16px;margin-top:16px}
.go .key{font-size:12px;height:26px}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;padding:0;list-style:none;font-size:13px}
.deltas li{border:1.5px solid currentColor;border-radius:3px;padding:0 9px;font-weight:900;font-family:var(--num)}
.deltas .up{color:var(--good)} .deltas .down{color:var(--warn)}
.lesson{border-left:3px solid var(--money);padding-left:12px;font-size:14.5px;line-height:1.7;color:#D5D9DE;margin-top:14px !important}
.note{font-size:14px;color:var(--warn)}
.prep label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5;cursor:pointer}
.prep input{width:20px;height:20px;margin-top:3px;accent-color:var(--money);flex:none}
.prep small{display:block;color:var(--muted);font-size:13px}
.lessons{padding-left:1.2em;font-size:14.5px;line-height:1.7;color:#D5D9DE}
.lessons li{margin-bottom:.5em}
footer{font-size:12px;color:var(--muted);margin-top:22px;padding:0 14px;line-height:1.6}
.snd{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;background:rgba(0,0,0,.8);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 12px;font-size:12.5px}
@media (min-width:760px){ main{padding-top:16px} .mission{font-size:14px} .vitals{font-size:12px} }
@media (prefers-reduced-motion:reduce){.hpbar i{transition:none}#bg svg,#bg img{animation:none}.low i{animation:none}#bg{transition:none}}
</style>
</head>
<body>
<button id="snd" class="snd">关闭声音</button>
<main>
  <div class="screen" id="screen">
    <div id="bg" aria-hidden="true"></div>
    <div class="hud mission" id="mission"></div>
    <div class="hud vitals" id="stats" aria-live="polite"></div>
    <div class="hud minimap" id="minimap" aria-hidden="true"></div>
    <div class="hud place" id="place"></div>
    <div class="banner" id="banner"></div>
  </div>
  <div id="stage"></div>
  <footer>原型版本。事件改编自常见的旅行安全提醒，概率和金额是占位数值，尚未按真实资料校准。这是行前教育工具，不能替代官方领事提醒和你自己的判断。键盘可用 A / B / C 选择，空格继续。</footer>
</main>

<script>
const STOPS = ["机场","旅馆","火车站","集市","列车","阿格拉","恒河","药店"];
let s;

function fresh(){
  return {budget:1400,gut:100,stamina:100,alert:50,i:-1,flags:{},lessons:[]};
}
const clamp = v => Math.max(0,Math.min(100,v));
const scam = p => s.alert < 30 ? Math.min(1,p*2) : p;
const hit = p => Math.random() < p;
function theft(amount){            // 保险赔付一半大额损失
  if(s.flags.insurance && amount >= 500) return {loss:amount/2, note:"旅行保险赔回了一半损失。"};
  return {loss:amount, note:""};
}

const NODES = [
{
  name:"德里机场", hi:"दिल्ली हवाई अड्डा", en:"Delhi Airport", when:"第 1 天，凌晨 1 点",
  scene:["你推着行李走出到达大厅。三十多度的热浪和十几个喊着“Taxi, my friend”的司机一起扑过来。","旅馆在帕哈甘吉，二十公里外。"],
  options:()=>[
    {label:"去大厅里的预付费出租车柜台", hint:"先付钱拿小票，价格固定，90 元", cost:90,
     run:()=>({text:"柜台给了你一张写着车牌号的小票。司机一路没说话，四十分钟后把你放在旅馆门口。", d:{budget:-90},
       lesson:"深夜抵达时，机场内的预付费柜台是最省心的选择：价格固定，车牌有记录。"})},
    {label:"跟报价最低的那位司机走", hint:"他开价只有柜台的一半",
     run:()=>{
       if(hit(scam(.1))){
         const t = theft(s.budget);
         return {text:"车没有开往市区。司机拐下高速，在一段没有路灯的土路上停了车，另一个男人拉开了后门。<br><br>天亮的时候，一位卡车司机在路边发现了你。护照、手机和钱都没了，你身上有伤。"+t.note, d:{budget:-t.loss,stamina:-100},
           lesson:"这是这个选择的最坏情况：不常见，但真实发生过，而且没有补救的机会。深夜抵达时只坐有登记的车，就是为了排除它。",
           over:{title:"行程终止",bg:"walk",lead:"你在医院做了笔录，使馆的工作人员帮你补办了旅行证件。三天后，你坐上了回国的航班。"}};
       }
       s.flags.lodged = true;
       return {text:"开到半路，司机打了个电话，然后回头说：“你订的那家旅馆昨天关门了。我认识一家更好的。”你说要去原来的地址，他摇头，说那片街区晚上封路。车已经开进了一条你在地图上找不到的小街。<br><br>房价是原来的四倍，前台收走了你的护照“登记”，第二天早上才还。", d:{budget:-430,alert:+10},
         lesson:"“你的旅馆关门了 / 着火了 / 那条路封了”是德里最经典的开场骗局。一旦上了没有登记的车，去哪里就不由你决定了。"};
     }},
    {label:"在机场坐到天亮，再搭地铁进城", hint:"最便宜，但今晚别想睡了",
     run:()=>({text:"你在到达厅的金属椅上半睡半醒坐了四个小时，抱着背包。五点多，第一班机场快线把你送进了市区。", d:{budget:-10,stamina:-15,alert:+10},
       lesson:"在机场等到天亮是很多独行旅客的做法：花体力，换来白天抵达陌生街区。"})}
  ]
},
{
  name:"帕哈甘吉", hi:"पहाड़गंज", en:"Paharganj", when:"第 1 天，清晨",
  skip:()=>s.flags.lodged,
  scene:["背包客聚集的主街刚刚醒来，卷帘门一扇扇拉起，霓虹招牌还没关。","你需要一个放行李、洗澡、睡几个小时的地方。"],
  options:()=>[
    {label:"12 人间青旅床位，40 元", hint:"没有储物柜，背包塞在床底",
     run:()=>{
       const t=theft(Math.min(s.budget,300));
       return {text:"上铺的人凌晨四点开始收拾行李，塑料袋响了半个小时。你后来睡得很沉。<br><br>醒来的时候，背包侧袋的拉链开着，里面的现金不见了。前台耸了耸肩，说他们不负责保管贵重物品。", d:{budget:-40-t.loss,stamina:+10,alert:+10},
         lesson:"多人间里，现金和证件要贴身放，或者自带挂锁用储物柜。没有储物柜的床位，省下的房费迟早要还回去。"};
     }},
    {label:"带锁的单间，180 元", hint:"风扇、冷水，但门能反锁", cost:180,
     run:()=>({text:"房间只比床大一圈，墙皮有点掉。你把门反锁，行李放在床边，一觉睡到九点。", d:{budget:-180,stamina:+25},
       lesson:"住宿上最值得花钱买的是一扇能反锁的门，其次才是空调和热水。"})},
    {label:"有空调和热水的酒店，420 元", hint:"超过你预算的三分之一", cost:420,
     run:()=>({text:"热水、白床单、遮光窗帘。你睡了这趟旅程里最好的一觉。", d:{budget:-420,stamina:+40},
       lesson:"休息好了，后面每一个判断都会更清醒。问题只是你的预算撑不撑得住。"})}
  ]
},
{
  name:"新德里火车站", hi:"नई दिल्ली", en:"New Delhi", when:"第 1 天，上午",
  scene:["你要买去阿格拉的火车票。刚走到站前广场，一个戴着工牌的男人拦住你。","“外国人售票处搬走了。我带你去官方办公室，很近。”"],
  options:()=>[
    {label:"出示手机里的电子票，直接进站", hint:s.flags.ticket?"你出发前已在官方 App 订好":"需要在行前准备里提前订票", disabled:!s.flags.ticket,
     run:()=>({text:"你晃了晃手机。他看了一眼，转身去找下一个人了。", d:{},
       lesson:"提前在官方渠道订票，可以整个跳过车站周边的“热心人”。"})},
    {label:"谢谢他，自己上二楼找国际游客售票处", hint:"它一直在站内，没有搬过",
     run:()=>({text:"他跟了你二十米，反复说那里关门了。二楼的售票处开着，冷气很足，你排了半小时队，按票面价买到了票。", d:{budget:-80,alert:+5},
       lesson:"国际游客售票处在车站内部。任何人告诉你它“搬了、关了、在街对面”，都不用理会。"})},
    {label:"跟他走", hint:"他有工牌，看起来很正式",
     run:()=>({text:"所谓的办公室是街对面一家旅行社。工作人员说今天的票都卖完了，只剩“特殊配额”。票是真的，只是价格贵了七倍。", d:{budget:-600,alert:+10},
       lesson:"工牌谁都能做。车站外的“官方办公室”几乎都是赚佣金的旅行社。"})}
  ]
},
{
  name:"月光集市", hi:"चाँदनी चौक", en:"Chandni Chowk", when:"第 1 天，中午",
  scene:["旧德里的窄巷里，香料、油炸面团和摩托车尾气的味道混在一起。头顶的电线缠成一团。","你从早上到现在什么都没吃。"],
  options:()=>[
    {label:"本地人排着长队的现炸摊位", hint:"咖喱角刚从油锅里捞出来",
     run:()=>({text:"你排了十分钟。咖喱角烫得拿不住，酸豆酱很辣。旁边的大叔看你吃得满头汗，笑着递来一张纸巾。<br><br>傍晚，你的肚子开始咕噜作响，一晚上跑了四趟厕所。本地人吃了没事的东西，你的肠胃还不认识。", d:{budget:-10,gut:-35,stamina:+15},
       lesson:"选现做、高温、本地人排队的摊位，能避开最严重的食物中毒。但刚到的头几天，陌生的菌群加上重油重香料，外国人的肠胃多半还是要闹一场，区别只在轻重。"})},
    {label:"切好的水果拼盘，加一杯加冰的甘蔗汁", hint:"天太热了，想吃点凉的",
     run:()=>{ s.budget=Math.max(0,s.budget-8); s.stamina=clamp(s.stamina+10); s.gut=clamp(s.gut-45); return {sub:NIGHT}; }},
    {label:"找一家有空调的连锁餐厅", hint:"120 元，是路边摊的十倍，但稳妥", cost:120,
     run:()=>({text:"冷气、塑封菜单、瓶装水。味道一般，但你坐了一个小时，缓了过来。", d:{budget:-120,stamina:+20},
       lesson:"刚到的头两天肠胃还没适应，吃得保守一点很划算。"})}
  ]
},
{
  name:"开往阿格拉的列车", hi:"दिल्ली – आगरा", en:"Delhi – Agra", when:"第 2 天，下午",
  scene:["对面铺位是一家四口。他们问你从哪里来、结婚没有、工资多少，聊了半个小时。","父亲从包里拿出一包已经拆开的饼干，又倒了一杯茶递给你。"],
  options:()=>[
    {label:"接过来，道谢", hint:"拒绝好像不太礼貌",
     run:()=>{
       if(hit(scam(.3))){
         const t = theft(Math.min(s.budget,1200)); s.flags.phoneLost = true;
         return {text:"你醒来时列车已经停在阿格拉，车厢空了。背包拉链开着，现金和手机都不见了。"+t.note, d:{budget:-t.loss,alert:+20,stamina:-10},
           lesson:"在食物饮料里下药后行窃，是印度铁路警方长期提醒的作案手法。看起来像一家人，并不能说明什么。"};
       }
       return {text:"饼干有点受潮，茶很甜。小女儿一直盯着你的相机看，你让她拍了几张。<br><br>一个小时后，你的肚子开始绞痛。那壶茶是用站台水龙头的水泡的，没有烧开。", d:{stamina:+5,alert:-10,gut:-25},
         lesson:"这家人没有恶意。但没烧开的水他们喝了没事，你不行。别人分享的食物有两层风险：少数是下了药的，更多的只是你的肠胃扛不住。"};
     }},
    {label:"说自己肠胃不好婉拒，拿出自己的零食分给孩子", hint:"你包里有两袋没拆的坚果",
     run:()=>{ s.flags.familyTip = true;
       return {text:"父亲笑着点头，说外国人到印度都这样。孩子们把坚果分了。下车前，他在你的本子上写了一家旅馆的名字：“我表弟开的。告诉他是拉杰什介绍的，他会来车站接你。”", d:{},
         lesson:"拒绝可以很体面。给一个不伤人的理由，再回赠点东西，关系反而更近了。"};
     }},
    {label:"摇头拒绝，把背包抱紧", hint:"小心驶得万年船",
     run:()=>({text:"父亲愣了一下，把饼干收了回去。剩下的两个小时没有人再跟你说话。你一直没敢合眼。", d:{alert:+10,stamina:-5},
       lesson:"安全是保住了。但全程把每个人都当成威胁，既累，也会错过这趟旅行里最好的部分。"})}
  ]
},
{
  name:"阿格拉", hi:"आगरा छावनी", en:"Agra Cantt", when:"第 2 天，傍晚",
  scene:["出站的时候天快黑了。旅馆在两公里外，房费 150 元到店付。","一个突突车司机迎上来：“去旅馆只要 20 卢比。明天我还可以免费带你游全城。”"],
  options:()=>{
    const canApp = s.flags.sim && !s.flags.phoneLost;
    const o = [];
    if(s.flags.familyTip) o.push({label:"打给列车上那家人推荐的旅馆，请他们来接", hint:"拉杰什的表弟",
      run:()=>({text:"十五分钟后，一个年轻人骑着摩托车到了车站，举着写有你名字的纸板。房间很小，但很干净，屋顶能看到泰姬陵的轮廓。房费只收了你 100 元。", d:{budget:-110},

/* ---------- sound: synthesized drone, heartbeat and stings ---------- */
const AU={ctx:null,muted:false,level:.15,pulse:true,calm:false,next:0};
const TENSE=[146.83,155.56,185,196,220,233.08,277.18,293.66];   // D Bhairav
const CALM=[293.66,329.63,369.99,440,493.88,587.33];            // D 大调五声
function initAudio(){
  if(AU.ctx){ AU.ctx.resume(); return; }
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  try{
    const c=AU.ctx=new C();
    AU.master=c.createGain(); AU.master.gain.value=AU.muted?0:.6; AU.master.connect(c.destination);
    AU.filter=c.createBiquadFilter(); AU.filter.type="lowpass"; AU.filter.frequency.value=420; AU.filter.Q.value=4;
    const dg=c.createGain(); dg.gain.value=.15; AU.filter.connect(dg); dg.connect(AU.master);
    [[73.42,-7],[73.42,7],[110,0],[146.83,4]].forEach(([f,d])=>{const o=c.createOscillator();o.type="sawtooth";o.frequency.value=f;o.detune.value=d;o.connect(AU.filter);o.start();});
    const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=.07; lg.gain.value=120; l.connect(lg); lg.connect(AU.filter.frequency); l.start();
    AU.tg=c.createGain(); AU.tg.gain.value=0; AU.tg.connect(AU.master);
    [[155.56,"sawtooth",.25],[207.65,"sine",.6],[311.13,"sine",.5]].forEach(([f,t,v])=>{const o=c.createOscillator();o.type=t;o.frequency.value=f;const tf=c.createBiquadFilter();tf.frequency.value=900;const g=c.createGain();g.gain.value=v;o.connect(tf);tf.connect(g);g.connect(AU.tg);o.start();});
    AU.delay=c.createDelay(1); AU.delay.delayTime.value=.38;
    const fb=c.createGain(); fb.gain.value=.45; AU.delay.connect(fb); fb.connect(AU.delay);
    const dw=c.createGain(); dw.gain.value=.5; AU.delay.connect(dw); dw.connect(AU.master);
    AU.next=c.currentTime+.3; setInterval(tick,90); setTension(AU.level);
  }catch(e){ AU.ctx=null; }
}
function tick(){
  const c=AU.ctx; if(!c||c.state!=="running") return;
  if(AU.next<c.currentTime) AU.next=c.currentTime+.05;
  while(AU.next<c.currentTime+.25){ beat(AU.next); AU.next+=60/(46+AU.level*58); }
}
function thump(t,v){
  const c=AU.ctx,o=c.createOscillator(),g=c.createGain();
  o.frequency.setValueAtTime(85,t); o.frequency.exponentialRampToValueAtTime(38,t+.16);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+.24);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+.26);
}
function pluck(t){
  const c=AU.ctx,sc=AU.calm?CALM:TENSE,o=c.createOscillator(),g=c.createGain();
  o.type="triangle"; o.frequency.value=sc[Math.floor(Math.random()*sc.length)]*(!AU.calm&&Math.random()<.3?2:1);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.15,t+.012); g.gain.exponentialRampToValueAtTime(.001,t+1.5);
  o.connect(g); g.connect(AU.master); g.connect(AU.delay); o.start(t); o.stop(t+1.6);
}
function beat(t){
  if(AU.pulse){ thump(t,.45+AU.level*.4); thump(t+.17,.28+AU.level*.3); }
  if(Math.random()<(AU.calm?.7:.35)) pluck(t+(Math.random()<.5?0:.3));
}
function setTension(l){
  AU.level=Math.max(0,Math.min(1,l)); const c=AU.ctx; if(!c) return;
  AU.tg.gain.setTargetAtTime(AU.level*AU.level*.09,c.currentTime,.8);
  AU.filter.frequency.setTargetAtTime(300+AU.level*700,c.currentTime,.8);
}
function calmMode(on){ AU.calm=on; AU.pulse=!on; if(on) setTension(0); }
function sting(big){
  const c=AU.ctx; if(!c||c.state!=="running") return; const t=c.currentTime,len=big?2.4:1.1;
  const f=c.createBiquadFilter(); f.frequency.value=1300; const g=c.createGain();
  g.gain.setValueAtTime(big?.2:.11,t); g.gain.exponentialRampToValueAtTime(.001,t+len); f.connect(g); g.connect(AU.master); g.connect(AU.delay);
  [110,116.54,164.81,233.08].forEach(fr=>{const o=c.createOscillator();o.type="sawtooth";o.frequency.setValueAtTime(fr,t);o.frequency.exponentialRampToValueAtTime(fr*.9,t+len);o.connect(f);o.start(t);o.stop(t+len);});
  const n=c.createBufferSource(),b=c.createBuffer(1,c.sampleRate*.4,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const ng=c.createGain(); ng.gain.value=big?.25:.12; n.buffer=b; n.connect(ng); ng.connect(AU.master); n.start(t);
  thump(t,.9);
}
const DANGER=[.4,.2,.35,.25,.45,.55,.3,.5];
const dangerLevel=sub=>sub?.95:(DANGER[s.i]||.3)+(s.stamina<40?.2:0)+(s.budget<300?.15:0)+(s.gut<40?.1:0);
document.getElementById("snd").onclick=e=>{
  AU.muted=!AU.muted; if(!AU.muted) initAudio();
  if(AU.ctx) AU.master.gain.setTargetAtTime(AU.muted?0:.6,AU.ctx.currentTime,.05);
  e.currentTarget.textContent=AU.muted?"打开声音":"关闭声音";
};

  g+=`<polyline points="${MAP.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#59626e" stroke-width="5" stroke-linejoin="round"/>`;
  if(nx) g+=`<path d="M${x},${y} L${nx[0]},${nx[1]}" stroke="#F4C430" stroke-width="3.5" stroke-dasharray="5 4"/><circle cx="${nx[0]}" cy="${nx[1]}" r="5" fill="#F4C430" stroke="#000" stroke-width="1.5"/>`;
  MAP.forEach((p,k)=>{ if(k<i) g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#9aa3ad"/>`; });
  g+=`<path d="M0,-8 L6,7 L0,3.5 L-6,7 Z" fill="#fff" stroke="#000" stroke-width="1.2" transform="translate(${x},${y}) rotate(${ang})"/>`;
  $("minimap").innerHTML=`<svg viewBox="${x-46} ${y-46} 92 92">${g}</svg>`;
}
const MISSION={"北印度生存指南":["行前准备","决定带什么上路"],"德里机场":["深夜抵达","找到去旅馆的车"],"帕哈甘吉":["落脚","找个地方睡几个小时"],"新德里火车站":["买票","买到去阿格拉的车票"],
  "月光集市":["觅食","吃点东西，别把肚子吃坏"],"开往阿格拉的列车":["陌生人的饼干","平安抵达阿格拉"],"阿格拉":["天黑之前","到达两公里外的旅馆"],"泰姬陵":["日出","看太阳升起来"],
  "瓦拉纳西":["恒河清晨","看一眼恒河"],"药店街":["表姐的委托","决定要不要帮带药"]};
function setMission(m){ $("mission").innerHTML = m ? `<b>任务：【${m[0]}】</b>${m[1]}` : ""; $("mission").style.display = m ? "" : "none"; }
function screenState(cls,title){ $("screen").className="screen"+(cls?" "+cls:""); $("banner").innerHTML = cls ? `<div><small>${cls==="fail"?"任务失败":"任务完成"}</small>${title}</div>` : ""; }
function board(name,hi,en){
  const n=Math.max(0,Math.min(STOPS.length,s.i+1));
  $("place").innerHTML=`<span id="pname">${name}</span><small>${hi}　${en}${s.i>=0&&s.i<STOPS.length?`　${n}/${STOPS.length}`:""}</small>`;
  setMission(MISSION[name]||null); return "";
}
function show(html){
  $("stage").innerHTML = html; drawStats(); drawRoute();
  document.querySelectorAll(".go").forEach(b=>b.insertAdjacentHTML("afterbegin",'<span class="key">空格</span>'));
  window.scrollTo({top:0});
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toLowerCase(), idx="abcd".indexOf(k)>=0?"abcd".indexOf(k):"1234".indexOf(k);
  if(idx>=0&&k.length===1){ const b=document.querySelectorAll(".opt")[idx]; if(b&&!b.disabled) b.click(); return; }
  if(k===" "||k==="enter"){ const b=document.querySelector(".go"); if(b&&e.target.tagName!=="BUTTON"){ e.preventDefault(); b.click(); } }
});

function start(){
  s = fresh(); setBg("start"); screenState(""); calmMode(false); setTension(.15);
  show(board("北印度生存指南","दिल्ली से वाराणसी","Delhi to Varanasi")+
  `<div class="panel"><p>四天，八站，从德里机场到泰姬陵的日出，再到恒河边。每一站你都要在省钱、省力和安全之间做选择。</p>
   <p>赶路、高温和时差会让你每过一站消耗 12 点体力和 5 点肠胃，吃饭和休息可以补回体力。</p>
   <p>全程你只有 1400 元预算，住宿、车票、吃饭、泰姬陵门票（110 元）和去瓦拉纳西的夜车（90 元）都从里面出。出发前可以先做些准备，每项都要花钱，但路上可能用得到。</p>
   <div class="prep">
     <label><input type="checkbox" data-k="ticket" data-c="70"><span>提前在官方 App 订火车票，70 元<small>到站后直接进站，不用和任何人打交道</small></span></label>
     <label><input type="checkbox" data-k="sim" data-c="40"><span>买一张当地电话卡，40 元<small>没有它用不了打车软件</small></span></label>
     <label><input type="checkbox" data-k="ors" data-c="20"><span>带一盒口服补液盐，20 元<small>腹泻时自动使用一次</small></span></label>
     <label><input type="checkbox" data-k="insurance" data-c="150"><span>买旅行保险，150 元<small>大额财物损失赔付一半</small></span></label>
   </div>
   <button class="go" id="depart">出发</button></div>`);
  $("depart").onclick=()=>{ if(!AU.muted) initAudio();
    document.querySelectorAll(".prep input:checked").forEach(c=>{s.flags[c.dataset.k]=true;s.budget-=+c.dataset.c;});
    next();
  };
}

function next(){ s.i++; while(s.i<NODES.length && NODES[s.i].skip && NODES[s.i].skip()) s.i++; if(s.i===6 && !s.flags.taj){ s.i=5; return sunrise(); } if(s.i>=NODES.length) return ending(null); scene(NODES[s.i]); }

function scene(n, sub){
  const src = sub || n, opts = src.options(); setBg(sub?(sub.bg||"walk"):BGS[s.i]); calmMode(false); setTension(dangerLevel(sub));
  show(board(n.name,n.hi,n.en)+
    `<div class="panel">${sub?"":`<p class="when">${n.when}</p>`}${src.scene.map(p=>`<p>${p}</p>`).join("")}</div>
     <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}" ${(o.disabled||o.cost>s.budget)?"disabled":""}><span class="key">${"ABCD"[i]}</span><span>${o.label}<small>${o.cost>s.budget?"钱不够了":(o.hint||"")}</small></span></button>`).join("")}</div>`);
  if(sub&&sub.mission) setMission(sub.mission);
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const r = opts[+b.dataset.i].run();
    if(r.sub) return scene(n, r.sub===true?WALK:r.sub);
    resolve(n,r);
  });
}

const LABEL={budget:"预算",gut:"肠胃",stamina:"体力",alert:"警觉"};
function resolve(n,r){
  const d = Object.assign({},r.d), notes=[];
  if(!r.over){ d.stamina=(d.stamina||0)-12; d.gut=(d.gut||0)-5; }   // 每一站的基础消耗：赶路、高温、时差
  // 节点结算
  const gutAfter = clamp(s.gut+(d.gut||0)), alertAfter = clamp(s.alert+(d.alert||0));
  if(!r.over && gutAfter<40){
    if(s.flags.ors){ s.flags.ors=false; d.gut=(d.gut||0)+35; notes.push("你冲了一袋口服补液盐，慢慢喝完，肚子稳住了一些。"); }
    else { d.stamina=(d.stamina||0)-15; notes.push("腹泻让你脱水乏力，体力额外下降。没有补液盐，只能硬撑。"); }
  }
  if(!r.over && alertAfter>70){ d.stamina=(d.stamina||0)-5; notes.push("你一直绷着神经，这很消耗体力。"); }
  for(const k in d){ if(k==="budget") s.budget=Math.max(0,s.budget+d[k]); else s[k]=clamp(s[k]+d[k]); }
  s.lessons.push(r.lesson);
  const chips = Object.keys(d).filter(k=>d[k]).map(k=>`<li class="${d[k]>0?"up":"down"}">${LABEL[k]} ${d[k]>0?"+":""}${Math.round(d[k])}</li>`).join("");
  const dead = r.over || (s.stamina<=0 ? "stamina" : s.budget<=0 ? "budget" : null);
  if(dead){ sting(true); setTension(1); } else if((d.budget||0)<=-250||(d.gut||0)<=-25||(d.stamina||0)<=-30) sting(false);
  show(board(n.name,n.hi,n.en)+
    `<div class="panel"><p>${r.text}</p>${notes.map(t=>`<p class="note">${t}</p>`).join("")}
     ${chips?`<ul class="deltas">${chips}</ul>`:""}
     <p class="lesson">${r.lesson}</p>
     <button class="go" id="cont">${dead?"查看结局":"继续前进"}</button></div>`);
  $("cont").onclick=()=> dead ? ending(dead) : next();
}

function sunrise(){
  if(s.budget<110){ return ending({title:"止步东门",bg:"agra",lead:"外国游客的门票加陵墓参观费要 110 元。你把口袋翻了个遍，不够。你站在围墙外面，看着天一点点亮了起来。"}); }
  s.budget-=110;
  s.stamina=clamp(s.stamina+20); s.alert=50; s.flags.taj=true; setBg("taj"); calmMode(true);
  const go = s.budget>=90; if(!go) s.flags.short=true;
  show(board("泰姬陵","ताज महल","Taj Mahal")+
    `<div class="panel"><p class="when">第 3 天，清晨 5 点 40 分</p>
     <p>你在东门排到了前五十个。天是灰蓝色的，草地上还有露水。</p>
     <p>然后太阳从你身后升起来，白色大理石先变成粉色，再变成金色。周围几百个人，没有一个人说话。</p>
     <p>这两天的所有麻烦，在这一刻都显得值得。</p>
     <ul class="deltas"><li class="down">门票 -110</li><li class="up">体力 +20</li><li class="up">警觉恢复到 50</li></ul>
     ${go?"<p>今晚有一班去瓦拉纳西的夜车，硬卧 90 元。</p>":"<p class=\"note\">去瓦拉纳西的夜车要 90 元，你的钱不够了。行程在这里结束。</p>"}
     <button class="go" id="cont">${go?"坐夜车去瓦拉纳西":"查看这趟旅程"}</button></div>`);
  $("cont").onclick=()=>{ if(!go) return ending(null); s.budget-=90; next(); };
}

function ending(dead){
  setBg(dead&&dead.bg||(dead?"start":s.flags.short?"taj":"ganga"));
  if(dead){ calmMode(false); AU.pulse=false; setTension(.5); } else calmMode(true);
  const title = dead&&dead.title || (dead==="stamina"?"体力耗尽":dead==="budget"?"预算见底":"抵达");
  const lead = dead&&dead.lead ? dead.lead : !dead&&s.flags.short ? "你看到了泰姬陵的日出，但钱只够走到这里。恒河留给下一次。" : dead==="stamina" ? "你在旅馆床上躺了两天，改签了回国的机票。这趟行程提前结束了。"
    : dead==="budget" ? "钱包空了。你给家里打了电话，订了最近一班回程。"
    : s.budget>=300 && s.gut>=55 ? "钱没丢，肚子没坏，日出和恒河都看到了。你像个老手一样走完了全程。"
    : s.budget>=120 ? "交了一点学费，但整体顺利。明天的航班回家。"
    : "这一路磕磕绊绊，学费交了不少。好在人平安，日出也看到了。";
  show(board(title,"यात्रा समाप्त","Journey's end")+
    (screenState(dead?"fail":"pass",title),"")+
    `<div class="panel"><p>${lead}</p>
     <p>你这一路学到的：</p>
     <ul class="lessons">${s.lessons.map(l=>`<li>${l}</li>`).join("")}</ul>
     <button class="go" id="again">再走一次</button></div>`);
  $("again").onclick=start;
}

start();
</script>
</body>
</html>
